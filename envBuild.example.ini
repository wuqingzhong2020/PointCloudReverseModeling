; 本机配置由 init 复制生成，实际修改 envBuild.local.ini。
; 完整配置与命令示例：docs/envBuild命令使用指南.md
; 路径建议使用 /，不加引号；多行路径须缩进。不展开环境变量。
[build]
; 对应根 CMakePresets.json 中的 configurePresets 名称。
configure_preset = vc143-cpp20
; 可选 release、debug、release_debug；命令行指定模式时优先。
default_mode = release
; 0 使用构建工具默认并行策略；正整数固定并行数，可被 --jobs 覆盖。
parallel_jobs = 0

[dependencies]
; 多个前缀每行一个；init 优先从已有 CMakeCache 读取。
; 填安装前缀，而非 bin 目录；例如 D:/SDK/x64-windows-v143-cpp20。
prefix_paths =

[tools]
; 留空自动查找；显式填写可执行文件完整路径，包含空格也不加引号。
; CPack 从所选 CMake 的同目录定位。
cmake =
; 仅 debug 启动命令需要，填写原生 cdb.exe，不填写 .bat/.cmd。
cdb =

[runtime]
; 通常全部留空，由 CMake 从匹配的依赖包推导。
; 如需补充 DLL 搜索目录，可每行一个绝对路径，注意区分 Debug/Release。
release_dll_dirs =
debug_dll_dirs =
; 自定义 OCCT 资源根目录，应直接包含 Shaders 等子目录。
occt_resource_dir =
; 修改后执行 compile 更新 CMake；清空以前设置过的覆盖项时加 --fresh。
